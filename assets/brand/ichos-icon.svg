  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#8FE3FF" stroke-opacity=".14" stroke-width="6"/>
  <g transform="translate(76 76) scale(0.703)">
  <defs>
    <linearGradient id="g2" gradientUnits="userSpaceOnUse" x1="40" y1="40" x2="470" y2="470">
      <stop offset="0" stop-color="#8FE3FF"/>
      <stop offset="0.5" stop-color="#3D8BFF"/>
      <stop offset="1" stop-color="#2A3FD8"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#g2)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <!-- the i -->
